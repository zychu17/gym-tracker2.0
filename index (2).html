<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym Tracker z Licznikiem Przerw</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857'
                        },
                        darkbg: '#0b0f19',
                        cardbg: '#1e293b',
                        inputbg: '#0f172a'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 9999px;
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes pulse-emerald {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.85; }
        }
        .animate-pulse-subtle {
            animation: pulse-emerald 1.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-12">

    <!-- HEADER -->
    <header class="sticky top-0 z-40 bg-[#0f172a]/95 backdrop-blur-md border-b border-slate-800 shadow-md">
        <div class="max-w-md mx-auto px-4 py-2.5 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-blue-500 flex items-center justify-center text-white shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-dumbbell text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-wide text-white leading-tight">GYM TRACKER</h1>
                    <p class="text-[11px] text-emerald-400 font-medium">Plan 4-Dniowy + Stoper Przerw</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <button onclick="openHistoryModal()" class="text-xs bg-slate-800 hover:bg-slate-700 text-blue-400 hover:text-blue-300 px-2.5 py-1.5 rounded-lg border border-slate-700 transition flex items-center space-x-1">
                    <i class="fa-solid fa-chart-line text-xs"></i>
                    <span>Historia</span>
                </button>
                <button onclick="resetCurrentDay()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-2.5 py-1.5 rounded-lg border border-slate-700 transition flex items-center space-x-1">
                    <i class="fa-solid fa-rotate-right text-xs"></i>
                    <span>Reset</span>
                </button>
            </div>
        </div>

        <!-- WEEK SELECTOR DROPDOWN -->
        <div class="max-w-md mx-auto px-3 py-2 border-t border-slate-800/80 flex items-center justify-between bg-slate-900/60">
            <div class="relative flex-1 mr-3">
                <select id="week-selector" onchange="switchWeek(this.value)" class="w-full bg-slate-800 text-white border border-slate-700 rounded-lg pl-3 pr-8 py-1.5 text-sm font-bold focus:outline-none focus:border-blue-500 appearance-none cursor-pointer">
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400">
                    <i class="fa-solid fa-chevron-down text-xs"></i>
                </div>
            </div>
            <button onclick="addNewWeek()" class="px-2.5 py-1.5 bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-400 border border-emerald-500/40 text-xs font-bold rounded-lg transition whitespace-nowrap flex items-center space-x-1">
                <i class="fa-solid fa-plus text-[10px]"></i>
                <span>Tydzień</span>
            </button>
        </div>

        <!-- DAY TABS -->
        <div class="max-w-md mx-auto px-2 pb-2 pt-1 overflow-x-auto no-scrollbar flex space-x-1 text-xs">
            <button id="tab-day1" onclick="switchDay('day1')" class="flex-1 min-w-[85px] py-2 px-1 rounded-lg text-center font-semibold transition flex flex-col items-center border border-transparent">
                <span>DZIEŃ 1</span>
                <span class="text-[10px] opacity-75 font-normal">Plecy/Biceps</span>
            </button>
            <button id="tab-day2" onclick="switchDay('day2')" class="flex-1 min-w-[85px] py-2 px-1 rounded-lg text-center font-semibold transition flex flex-col items-center border border-transparent">
                <span>DZIEŃ 2</span>
                <span class="text-[10px] opacity-75 font-normal">Barki/Triceps</span>
            </button>
            <button id="tab-day3" onclick="switchDay('day3')" class="flex-1 min-w-[85px] py-2 px-1 rounded-lg text-center font-semibold transition flex flex-col items-center border border-transparent">
                <span>DZIEŃ 3</span>
                <span class="text-[10px] opacity-75 font-normal">Klata/Przedr.</span>
            </button>
            <button id="tab-day4" onclick="switchDay('day4')" class="flex-1 min-w-[85px] py-2 px-1 rounded-lg text-center font-semibold transition flex flex-col items-center border border-transparent">
                <span>DZIEŃ 4</span>
                <span class="text-[10px] opacity-75 font-normal">Nogi</span>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-md mx-auto w-full px-3 pt-4 flex-1">
        
        <!-- DAY BANNER & STATS -->
        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 mb-4 backdrop-blur-sm shadow-lg">
            <div class="flex justify-between items-start mb-2">
                <div>
                    <div class="flex items-center space-x-2 mb-1">
                        <span id="week-badge" class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-blue-500/20 text-blue-400 border border-blue-500/30 uppercase">
                            TYDZIEŃ 1
                        </span>
                        <span id="day-badge" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 uppercase">
                            DZIEŃ 1
                        </span>
                    </div>
                    <h2 id="day-title" class="text-lg font-bold text-white">Plecy + Biceps + Nogi</h2>
                </div>
                <div class="text-right">
                    <span class="text-[11px] text-slate-400 block uppercase tracking-wider font-medium">Tonaż całkowity</span>
                    <span id="total-volume" class="text-xl font-extrabold text-emerald-400">0 <span class="text-xs font-normal text-slate-300">kg</span></span>
                </div>
            </div>

            <!-- PROGRESS BAR -->
            <div class="mt-3">
                <div class="flex justify-between text-xs text-slate-400 mb-1">
                    <span>Postęp treningu</span>
                    <span id="progress-percentage" class="font-bold text-slate-200">0%</span>
                </div>
                <div class="w-full h-2 bg-slate-900 rounded-full overflow-hidden p-0.5 border border-slate-700/50">
                    <div id="progress-bar" class="h-full bg-gradient-to-r from-emerald-500 to-blue-500 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- EXERCISES LIST CONTAINER -->
        <div id="exercises-container" class="space-y-4">
            <!-- Dynamic exercise cards injected via JavaScript -->
        </div>

    </main>

    <!-- FLOATING CORNER REST TIMER WIDGET (BOTTOM-RIGHT CORNER) -->
    <div id="rest-timer-widget" class="fixed bottom-4 right-4 z-50 transition-all duration-300">
        
        <!-- EXPANDED TIMER CARD CARD (Exact design matching requested image) -->
        <div id="timer-card" class="w-72 bg-[#0d1527] border border-slate-800 rounded-2xl p-4 shadow-2xl backdrop-blur-md transition-all">
            
            <!-- HEADER ROW -->
            <div class="flex items-center justify-between pb-3 border-b border-slate-800/80">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-stopwatch text-red-500 text-sm"></i>
                    <span class="text-xs font-extrabold text-white tracking-wide uppercase">STOPER PRZERW</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="toggleTimerSound()" id="timer-sound-btn" class="text-slate-400 hover:text-emerald-400 text-xs p-1 transition" title="Włącz/wyłącz dźwięk">
                        <i id="sound-icon" class="fa-solid fa-volume-high"></i>
                    </button>
                    <button onclick="toggleWidgetCollapse()" class="text-slate-400 hover:text-white text-xs p-1 transition" title="Zwiń stoper">
                        <i id="collapse-chevron" class="fa-solid fa-chevron-down"></i>
                    </button>
                </div>
            </div>

            <!-- TIME DISPLAY & STATUS -->
            <div class="text-center my-3.5">
                <div id="timer-display" class="text-4xl font-black text-white tracking-widest font-mono drop-shadow">01:30</div>
                <div id="timer-status-text" class="text-[11px] text-slate-400 mt-1 font-medium">Gotowy do odliczania</div>
            </div>

            <!-- PRESET BUTTONS ROW (60s, 90s, 2m, 3m) -->
            <div class="grid grid-cols-4 gap-1.5 mb-3.5">
                <button onclick="setTimerPreset(60)" id="preset-60" class="timer-preset-btn py-1.5 bg-[#172033] hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl border border-slate-700/50 transition active:scale-95">60s</button>
                <button onclick="setTimerPreset(90)" id="preset-90" class="timer-preset-btn py-1.5 bg-[#172033] hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl border border-slate-700/50 transition active:scale-95">90s</button>
                <button onclick="setTimerPreset(120)" id="preset-120" class="timer-preset-btn py-1.5 bg-[#172033] hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl border border-slate-700/50 transition active:scale-95">2m</button>
                <button onclick="setTimerPreset(180)" id="preset-180" class="timer-preset-btn py-1.5 bg-[#172033] hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl border border-slate-700/50 transition active:scale-95">3m</button>
            </div>

            <!-- ACTION BUTTONS: GREEN START BUTTON + RESET BUTTON -->
            <div class="flex items-center space-x-2">
                <button id="timer-toggle-btn" onclick="toggleTimer()" class="flex-1 py-2.5 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-extrabold text-sm rounded-2xl shadow-lg shadow-emerald-500/25 transition flex items-center justify-center space-x-2">
                    <i id="timer-toggle-icon" class="fa-solid fa-play text-xs"></i>
                    <span id="timer-toggle-text">Start</span>
                </button>
                <button onclick="resetTimer()" class="w-11 h-11 bg-[#172033] hover:bg-slate-700 active:scale-95 text-slate-300 border border-slate-700/60 rounded-2xl transition flex items-center justify-center text-sm shadow" title="Resetuj stoper">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </div>

        <!-- MINIMIZED TIMER PILL BUTTON -->
        <button id="timer-minimized-pill" onclick="toggleWidgetCollapse()" class="hidden bg-[#0d1527] border border-emerald-500/60 hover:border-emerald-400 text-white px-3.5 py-2.5 rounded-full shadow-2xl backdrop-blur-md flex items-center space-x-2 transition active:scale-95">
            <i class="fa-solid fa-stopwatch text-red-500 text-sm"></i>
            <span id="minimized-timer-display" class="font-mono font-bold text-xs text-emerald-400">01:30</span>
            <i class="fa-solid fa-chevron-up text-slate-400 text-[10px]"></i>
        </button>
    </div>

    <!-- YOUTUBE VIDEO TUTORIAL MODAL -->
    <div id="video-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-3 transition-opacity">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-4 shadow-2xl flex flex-col max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-700">
                <div class="flex items-center space-x-2 pr-2">
                    <i class="fa-brands fa-youtube text-red-500 text-xl"></i>
                    <h3 id="video-modal-title" class="font-bold text-white text-sm line-clamp-1">Instrukcja Wideo</h3>
                </div>
                <button onclick="closeVideoModal()" class="text-slate-400 hover:text-white p-1 rounded-lg bg-slate-700/50 hover:bg-slate-700 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="relative w-full aspect-video rounded-xl overflow-hidden bg-black mb-3 shadow-inner border border-slate-700/80">
                <iframe id="video-iframe" class="absolute inset-0 w-full h-full border-0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen></iframe>
            </div>

            <div class="bg-slate-900/90 border border-slate-700/80 rounded-xl p-3 mb-3 text-xs space-y-1.5">
                <div class="font-bold text-emerald-400 flex items-center space-x-1">
                    <i class="fa-solid fa-lightbulb text-amber-400"></i>
                    <span>Wskazówki techniczne:</span>
                </div>
                <p id="video-modal-tips" class="text-slate-300 leading-relaxed font-normal">
                    Ładowanie wskazówek...
                </p>
            </div>

            <a id="video-yt-link" href="#" target="_blank" rel="noopener noreferrer" 
               class="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded-xl transition text-center flex items-center justify-center space-x-2 shadow-md shadow-red-600/20">
                <i class="fa-brands fa-youtube text-base"></i>
                <span>Otwórz w aplikacji YouTube</span>
            </a>
        </div>
    </div>

    <!-- HISTORY / COMPARISON MODAL -->
    <div id="history-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-5 shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-700">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-chart-line text-blue-400 text-lg"></i>
                    <h3 class="font-bold text-white text-base">Historia & Progresja</h3>
                </div>
                <button onclick="closeHistoryModal()" class="text-slate-400 hover:text-white p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="mb-3">
                <label class="text-xs text-slate-400 block mb-1 font-medium">Wybierz ćwiczenie do porównania:</label>
                <select id="history-exercise-select" onchange="renderExerciseHistory()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-medium focus:outline-none focus:border-emerald-500">
                </select>
            </div>

            <div id="history-content" class="flex-1 overflow-y-auto space-y-3 pr-1 pt-1">
            </div>
        </div>
    </div>

        let currentDayKey = 'day1';

        // REST TIMER STATE VARIABLES
        let timerInterval = null;
        let defaultTime = 90; // Default: 90 seconds
        let remainingSeconds = 90;
        let isTimerRunning = false;
        let isCollapsed = false;
        let isSoundEnabled = true;
        let audioCtx = null;

        function playFinishBeep() {
            if (!isSoundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;
                for (let i = 0; i < 3; i++) {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, now + i * 0.22); // A5 tone

                    gain.gain.setValueAtTime(0.3, now + i * 0.22);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.22 + 0.16);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(now + i * 0.22);
                    osc.stop(now + i * 0.22 + 0.16);
                }
            } catch (e) {
                console.error("Błąd audio:", e);
            }
        }

        function updateTimerUI() {
            const minutes = Math.floor(remainingSeconds / 60);
            const seconds = remainingSeconds % 60;
            const formatted = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            document.getElementById('timer-display').innerText = formatted;
            document.getElementById('minimized-timer-display').innerText = formatted;

            const toggleIcon = document.getElementById('timer-toggle-icon');
            const toggleText = document.getElementById('timer-toggle-text');
            const statusText = document.getElementById('timer-status-text');
            const toggleBtn = document.getElementById('timer-toggle-btn');

            if (isTimerRunning) {
                toggleIcon.className = "fa-solid fa-pause text-xs";
                toggleText.innerText = "Pauza";
                statusText.innerText = "Odliczanie...";
                statusText.className = "text-emerald-400 font-bold animate-pulse mt-1 text-[11px]";
                toggleBtn.className = "flex-1 py-2.5 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-extrabold text-sm rounded-2xl shadow-lg shadow-emerald-500/40 transition flex items-center justify-center space-x-2 animate-pulse-subtle";
            } else if (remainingSeconds === 0) {
                toggleIcon.className = "fa-solid fa-play text-xs";
                toggleText.innerText = "Start";
                statusText.innerText = "Koniec przerwy!";
                statusText.className = "text-amber-400 font-extrabold mt-1 text-[11px]";
                toggleBtn.className = "flex-1 py-2.5 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-extrabold text-sm rounded-2xl shadow-lg shadow-emerald-500/25 transition flex items-center justify-center space-x-2";
            } else {
                toggleIcon.className = "fa-solid fa-play text-xs";
                toggleText.innerText = remainingSeconds < defaultTime ? "Wznów" : "Start";
                statusText.innerText = "Gotowy do odliczania";
                statusText.className = "text-slate-400 font-medium mt-1 text-[11px]";
                toggleBtn.className = "flex-1 py-2.5 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-extrabold text-sm rounded-2xl shadow-lg shadow-emerald-500/25 transition flex items-center justify-center space-x-2";
            }

            // Highlight Active Preset Button
            [60, 90, 120, 180].forEach(sec => {
                const btn = document.getElementById(`preset-${sec}`);
                if (btn) {
                    if (defaultTime === sec) {
                        btn.className = "timer-preset-btn py-1.5 bg-blue-600/30 text-blue-300 border border-blue-500/60 text-xs font-bold rounded-xl transition active:scale-95 shadow-sm";
                    } else {
                        btn.className = "timer-preset-btn py-1.5 bg-[#172033] hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl border border-slate-700/50 transition active:scale-95";
                    }
                }
            });
        }

        function startTimer(secondsToSet) {
            if (secondsToSet !== undefined) {
                defaultTime = secondsToSet;
                remainingSeconds = secondsToSet;
            }

            if (remainingSeconds <= 0) {
                remainingSeconds = defaultTime;
            }

            clearInterval(timerInterval);
            isTimerRunning = true;
            updateTimerUI();

            timerInterval = setInterval(() => {
                if (remainingSeconds > 0) {
                    remainingSeconds--;
                    updateTimerUI();
                } else {
                    clearInterval(timerInterval);
                    isTimerRunning = false;
                    updateTimerUI();
                    playFinishBeep();
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            updateTimerUI();
        }

        function toggleTimer() {
            if (isTimerRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            remainingSeconds = defaultTime;
            updateTimerUI();
        }

        function setTimerPreset(seconds) {
            defaultTime = seconds;
            startTimer(seconds);
        }

            isCollapsed = !isCollapsed;
            const card = document.getElementById('timer-card');
            const pill = document.getElementById('timer-minimized-pill');

            if (isCollapsed) {
                card.classList.add('hidden');
                pill.classList.remove('hidden');
            } else {
                card.classList.remove('hidden');
                pill.classList.add('hidden');
            }

        function loadSavedData() {
            try {
                const data = localStorage.getItem('gym_tracker_weeks_data');
                if (data) {
                    const parsed = JSON.parse(data);
                    savedData = parsed.data || {};
                    totalWeeks = parsed.totalWeeks || 4;
                    currentWeekNumber = parsed.currentWeekNumber || 1;
                } else {
                    const oldData = localStorage.getItem('gym_tracker_data');
                    if (oldData) {
                        const parsedOld = JSON.parse(oldData);
                        savedData['week_1'] = parsedOld;
                    }
                }
            } catch (e) {
                console.error("Błąd localStorage:", e);
                savedData = {};
            }
        }

        function saveData() {
            try {
                const payload = {
                    totalWeeks: totalWeeks,
                    currentWeekNumber: currentWeekNumber,
                    data: savedData
                };
                localStorage.setItem('gym_tracker_weeks_data', JSON.stringify(payload));
            } catch (e) {
                console.error("Błąd zapisu:", e);
            }
        }

        function renderWeekTabs() {
            const select = document.getElementById('week-selector');
            select.innerHTML = '';

            for (let i = 1; i <= totalWeeks; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.innerText = `Tydzień ${i}`;
                if (i === currentWeekNumber) {
                    opt.selected = true;
                }
                select.appendChild(opt);
            }
        }

        function switchWeek(weekNum) {
            currentWeekNumber = parseInt(weekNum);
            saveData();
            renderWeekTabs();
            renderDayContent();
        }

        function addNewWeek() {
            totalWeeks++;
            currentWeekNumber = totalWeeks;
            saveData();
            renderWeekTabs();

        function switchDay(dayKey) {
            currentDayKey = dayKey;
            
            ['day1', 'day2', 'day3', 'day4'].forEach(key => {
                const btn = document.getElementById(`tab-${key}`);
                if (key === dayKey) {
                    btn.className = "flex-1 min-w-[85px] py-2 px-1 rounded-lg text-center font-semibold transition flex flex-col items-center bg-gradient-to-r from-emerald-500 to-emerald-600 text-white shadow-md shadow-emerald-500/20 border border-emerald-400/30";
                } else {
                    btn.className = "flex-1 min-w-[85px] py-2 px-1 rounded-lg text-center font-semibold transition flex flex-col items-center bg-slate-800/80 text-slate-400 hover:bg-slate-700/80 hover:text-slate-200 border border-slate-700/50";
                }
            });

            renderDayContent();
        }

        function getPreviousWeekSetData(exId, setNum) {
            if (currentWeekNumber <= 1) return null;
            const prevWeekKey = `week_${currentWeekNumber - 1}`;
            if (!savedData[prevWeekKey]) return null;

            const wKey = `${exId}_s${setNum}_w`;
            const rKey = `${exId}_s${setNum}_r`;
            const w = savedData[prevWeekKey][wKey];
            const r = savedData[prevWeekKey][rKey];

            if (w !== undefined && r !== undefined && w !== "" && r !== "") {
                return { weight: w, reps: r };
            }
            return null;
        }

        function renderDayContent() {
            const currentWorkout = workoutData[currentDayKey];
            const weekDataKey = `week_${currentWeekNumber}`;
            const currentWeekData = savedData[weekDataKey] || {};

            document.getElementById('week-badge').innerText = `TYDZIEŃ ${currentWeekNumber}`;
            document.getElementById('day-badge').innerText = currentWorkout.badge;
            document.getElementById('day-title').innerText = currentWorkout.title;

            const container = document.getElementById('exercises-container');

            currentWorkout.exercises.forEach(ex => {
                const card = document.createElement('div');

                let rowsHtml = '';

                    const setKeyWeight = `${ex.id}_s${i}_w`;
                    const setKeyReps = `${ex.id}_s${i}_r`;
                    const setKeyDone = `${ex.id}_s${i}_d`;

                    const valWeight = currentWeekData[setKeyWeight] !== undefined ? currentWeekData[setKeyWeight] : '';
                    const valReps = currentWeekData[setKeyReps] !== undefined ? currentWeekData[setKeyReps] : '';
                    const isDone = currentWeekData[setKeyDone] === true;

                    const prevData = getPreviousWeekSetData(ex.id, i);
                    const prevHintHtml = prevData 
                        ? `<div class="text-[10px] text-blue-400/90 font-medium pl-8 pb-1 flex items-center space-x-1">
                             <i class="fa-solid fa-clock-rotate-left text-[9px]"></i>
                             <span>Poprzednio (Tydz. ${currentWeekNumber - 1}): <strong class="text-blue-300">${prevData.weight} kg × ${prevData.reps}</strong></span>
                           </div>`
                        : '';

                    rowsHtml += `
                        <div class="py-1 border-b border-slate-700/40 last:border-0">
                            <div class="flex items-center space-x-2 py-1 ${isDone ? 'opacity-60' : ''}">
                                <span class="w-6 text-xs font-bold text-slate-400 text-center">#${i}</span>
                                
                                <div class="flex-1 flex items-center bg-slate-900/80 border border-slate-700/80 rounded-xl px-2.5 py-1 focus-within:border-emerald-500 transition">
                                    <input type="number" step="0.5" placeholder="0" value="${valWeight}" 
                                        oninput="updateInputValue('${setKeyWeight}', this.value)"
                                        class="w-full bg-transparent text-sm font-semibold text-white focus:outline-none text-right pr-1">
                                    <span class="text-[11px] text-slate-400 font-medium">kg</span>
                                </div>

                                <div class="flex-1 flex items-center bg-slate-900/80 border border-slate-700/80 rounded-xl px-2.5 py-1 focus-within:border-emerald-500 transition">
                                    <input type="number" placeholder="${ex.targetReps.split('–')[0]}" value="${valReps}" 
                                        oninput="updateInputValue('${setKeyReps}', this.value)"
                                        class="w-full bg-transparent text-sm font-semibold text-white focus:outline-none text-right pr-1">

                                </div>

                                <button onclick="toggleSetDone('${setKeyDone}')" class="w-9 h-9 rounded-xl flex items-center justify-center transition active:scale-95 ${isDone ? 'bg-emerald-500 text-white shadow-md shadow-emerald-500/20' : 'bg-slate-700/60 text-slate-400 hover:bg-slate-700'}">
                                    <i class="fa-solid fa-check text-sm"></i>

                }

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30 uppercase tracking-wider">${ex.tag}</span>
                                <button onclick="openVideoModal('${ex.id}')" class="px-2 py-0.5 rounded bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/30 text-[10px] font-bold transition flex items-center space-x-1">
                                    <i class="fa-brands fa-youtube text-[11px]"></i>
                                    <span>Wideo</span>
                                </button>
                            </div>
                            <h3 class="text-sm font-bold text-white mt-1.5">${ex.name}</h3>
                        </div>
                        <div class="text-right text-[11px] text-slate-400 space-y-0.5">
                            <div>Reps: <span class="font-bold text-slate-200">${ex.targetReps}</span></div>
                            <div>Tempo: <span class="font-bold text-slate-200">${ex.tempo}</span> | RIR: <span class="font-bold text-slate-200">${ex.rir}</span></div>
                        </div>
                    </div>
                    <div class="mt-2 space-y-1">
                        ${rowsHtml}
                    </div>
                `;

                container.appendChild(card);
            });

            calculateStats();
        }

        function updateInputValue(key, value) {
            const weekKey = `week_${currentWeekNumber}`;
            if (!savedData[weekKey]) savedData[weekKey] = {};

            if (value === "") {
                delete savedData[weekKey][key];
            } else {
                savedData[weekKey][key] = parseFloat(value) || value;
            }
            saveData();
            calculateStats();
        }

        function toggleSetDone(key) {
            const weekKey = `week_${currentWeekNumber}`;
            if (!savedData[weekKey]) savedData[weekKey] = {};

            const isDoneNow = !savedData[weekKey][key];
            savedData[weekKey][key] = isDoneNow;
            saveData();
            renderDayContent();

            // Auto-start rest timer when checking set
            if (isDoneNow) {
                if (isCollapsed) {
                    toggleWidgetCollapse(); // Expand timer if minimized
                }
                startTimer(defaultTime);
            }
        }

        function calculateStats() {
            const currentWorkout = workoutData[currentDayKey];
            const weekKey = `week_${currentWeekNumber}`;
            const currentWeekData = savedData[weekKey] || {};

            let totalVolume = 0;
            let totalSets = 0;
            let completedSets = 0;

            currentWorkout.exercises.forEach(ex => {
                for (let i = 1; i <= ex.sets; i++) {
                    totalSets++;
                    const setKeyWeight = `${ex.id}_s${i}_w`;
                    const setKeyReps = `${ex.id}_s${i}_r`;
                    const setKeyDone = `${ex.id}_s${i}_d`;

                    const w = parseFloat(currentWeekData[setKeyWeight]) || 0;
                    const r = parseFloat(currentWeekData[setKeyReps]) || 0;

                    if (currentWeekData[setKeyDone]) {
                        completedSets++;
                    }

                    totalVolume += (w * r);
                }
            });

            document.getElementById('total-volume').innerHTML = `${totalVolume.toLocaleString('pl-PL')} <span class="text-xs font-normal text-slate-300">kg</span>`;
            
            const percentage = totalSets > 0 ? Math.round((completedSets / totalSets) * 100) : 0;
            document.getElementById('progress-percentage').innerText = `${percentage}%`;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
        }

        function resetCurrentDay() {
            if (confirm(`Czy na pewno chcesz zresetować Dzień ${workoutData[currentDayKey].badge} w Tygodniu ${currentWeekNumber}?`)) {
                const weekKey = `week_${currentWeekNumber}`;
                if (savedData[weekKey]) {
                    const currentWorkout = workoutData[currentDayKey];
                    currentWorkout.exercises.forEach(ex => {
                        for (let i = 1; i <= ex.sets; i++) {
                            delete savedData[weekKey][`${ex.id}_s${i}_w`];
                            delete savedData[weekKey][`${ex.id}_s${i}_r`];
                            delete savedData[weekKey][`${ex.id}_s${i}_d`];
                        }
                    });
                    saveData();
                    renderDayContent();
                }
            }
        }

        function openVideoModal(exId) {

            Object.values(workoutData).forEach(day => {
                const match = day.exercises.find(e => e.id === exId);
                if (match) foundExercise = match;
            });

            if (!foundExercise) return;

            document.getElementById('video-modal-title').innerText = foundExercise.name;
            document.getElementById('video-modal-tips').innerText = foundExercise.tips || "Brak szczegółowych opisów dla tego ćwiczenia.";

            let embedUrl = "";
            let ytUrl = "";

            if (foundExercise.videoId && !foundExercise.videoId.includes("_")) {
                embedUrl = `https://www.youtube.com/embed/${foundExercise.videoId}?autoplay=1&rel=0`;
                ytUrl = `https://www.youtube.com/watch?v=${foundExercise.videoId}`;
            } else {
                const query = encodeURIComponent(foundExercise.name + " technika siłownia");
                embedUrl = `https://www.youtube.com/embed?listType=search&list=${query}`;
                ytUrl = `https://www.youtube.com/results?search_query=${query}`;
            }

            document.getElementById('video-iframe').src = embedUrl;
            document.getElementById('video-yt-link').href = ytUrl;

            document.getElementById('video-modal').classList.remove('hidden');
        }

        function closeVideoModal() {
            document.getElementById('video-iframe').src = "";
            document.getElementById('video-modal').classList.add('hidden');
        }

        function openHistoryModal() {
            const select = document.getElementById('history-exercise-select');
            select.innerHTML = '';

            Object.keys(workoutData).forEach(dKey => {
                const dayObj = workoutData[dKey];
                const group = document.createElement('optgroup');
                group.label = `${dayObj.badge}: ${dayObj.title}`;

                dayObj.exercises.forEach(ex => {
                    const opt = document.createElement('option');
                    opt.value = ex.id;
                    opt.innerText = ex.name;
                    group.appendChild(opt);
                });

                select.appendChild(group);
            });

            document.getElementById('history-modal').classList.remove('hidden');
            renderExerciseHistory();

        function closeHistoryModal() {
            document.getElementById('history-modal').classList.add('hidden');
        }

        function renderExerciseHistory() {
            const exId = document.getElementById('history-exercise-select').value;
            const container = document.getElementById('history-content');
            container.innerHTML = '';

            let foundExercise = null;
            Object.values(workoutData).forEach(day => {
                const match = day.exercises.find(e => e.id === exId);
                if (match) foundExercise = match;
            });

            if (!foundExercise) return;

            for (let w = 1; w <= totalWeeks; w++) {
                const weekKey = `week_${w}`;
                const weekData = savedData[weekKey] || {};

                let setsHtml = '';
                let weekVolume = 0;
                let hasData = false;

                for (let i = 1; i <= foundExercise.sets; i++) {
                    const weight = weekData[`${exId}_s${i}_w`];
                    const reps = weekData[`${exId}_s${i}_r`];
                    const done = weekData[`${exId}_s${i}_d`];

                    if (weight !== undefined && reps !== undefined) {
                        hasData = true;
                        const vol = (parseFloat(weight) || 0) * (parseFloat(reps) || 0);
                        weekVolume += vol;

                        setsHtml += `
                            <div class="flex justify-between items-center text-xs py-1 border-b border-slate-700/50 last:border-0">
                                <span class="text-slate-400 font-medium">Seria #${i}</span>
                                <span class="font-bold text-slate-100">${weight} kg × ${reps} powt. ${done ? '<i class="fa-solid fa-check text-emerald-400 ml-1"></i>' : ''}</span>
                            </div>
                        `;
                    }
                }

                const item = document.createElement('div');
                item.className = "bg-slate-900 border border-slate-700/80 rounded-xl p-3";

                if (hasData) {
                    item.innerHTML = `
                        <div class="flex justify-between items-center mb-2 pb-1 border-b border-slate-800">
                            <span class="text-xs font-bold text-blue-400">TYDZIEŃ ${w}</span>
                            <span class="text-xs font-semibold text-emerald-400">Tonaż: ${weekVolume} kg</span>
                        </div>
                        <div class="space-y-0.5">
                            ${setsHtml}
                        </div>
                    `;
                } else {
                    item.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-slate-400">TYDZIEŃ ${w}</span>
                            <span class="text-xs text-slate-300 italic">Brak wpisanych danych</span>
                        </div>
                    `;
                }

                container.appendChild(item);
            }
        }

        window.onload = function() {
            loadSavedData();
